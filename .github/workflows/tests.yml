name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Deps ligeras (sin torch/transformers)
        run: |
          pip install aiohttp msgpack cryptography pytest
      - name: pytest suite ligera y e2e del tracker
        run: |
          pytest -q tests/test_client_routing.py tests/test_config_qos.py \
            tests/test_protocol.py tests/test_routing.py tests/test_tls_pow.py \
            tests/test_tracker.py
      - name: Auditoría de dependencias Python
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt --strict
