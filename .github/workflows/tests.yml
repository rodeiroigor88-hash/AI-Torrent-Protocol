name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Deps ligeras (sin torch/transformers)
        run: |
          pip install aiohttp msgpack cryptography pytest
      - name: pytest tracker (salta el e2e que necesita torch)
        run: |
          pytest -q tests/test_tracker.py -k 'not end_to_end'
